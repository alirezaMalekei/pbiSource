name: pbisource

services:
  db:
    image: percona/percona-server:8.0
    container_name: pbisource-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: ${TZ:-UTC}
    volumes:
      - mysql_data:/var/lib/mysql
    # اگر برنامه‌ای روی همین سرور باید وصل شود، خط زیر را فعال کنید:
    # ports: ["127.0.0.1:3306:3306"]
    healthcheck:
      # ping حتی با رمز نامعتبر هم "alive" برمی‌گرداند، پس به رمز وابسته نیستیم
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  scheduler:
    build: .
    container_name: pbisource-scheduler
    restart: unless-stopped
    command: ["supercronic", "/app/crontab"]
    environment:
      TZ: ${TZ:-UTC}
      DB_CONTAINER: pbisource-db
      DB_UID: "1001"          # فقط fallback؛ در حالت عادی از خود db خوانده می‌شود
    volumes:
      - mysql_data:/var/lib/mysql
      - /srv/backups:/backups
      - restore_work:/work
      - restore_state:/state
      - /var/run/docker.sock:/var/run/docker.sock
      - ./xb.php:/app/xb.php:ro
      - ./crontab:/app/crontab:ro

volumes:
  mysql_data:
  restore_work:
  restore_state: