name: pbisource

services:
  db:
    image: percona/percona-server:8.0.35-27
    container_name: pbisource-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: ${TZ:-UTC}
    ports:
      - "3306:3306"          # برای دسترسی مستقیم از بیرون (بخش امنیت را ببینید)
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  scheduler:
    build: .
    container_name: pbisource-scheduler
    restart: unless-stopped
    command: ["sleep", "infinity"]
    environment:
      TZ: ${TZ:-UTC}
      DB_CONTAINER: pbisource-db
      DB_UID: "1001"
    volumes:
      - mysql_data:/var/lib/mysql
      - /srv/backups:/backups
      - restore_work:/work
      - restore_state:/state
      - /var/run/docker.sock:/var/run/docker.sock
      - ./xb.php:/app/xb.php:ro

volumes:
  mysql_data:
  restore_work:
  restore_state: